# Global settings for the AT Assistant

[paths]
model_paths = "/opt/at/models"
sqlite_path = "/var/lib/at/memory.db"
socket_dir = "/run/at"
personality_file = "/etc/at/personality.md"

[logging]
level = "INFO"
directory = "/var/log/at"
rotation = "10MB"

[audio]
sample_rate = 16000
frame_size = 480

[session]
boundary_duration = 1800